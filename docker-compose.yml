version: '3.8'

services:
  postgres:
    image: timescale/timescaledb-ha:pg16-latest
    container_name: onsflow-postgres
    environment:
      POSTGRES_DB: onsflow_dev
      POSTGRES_USER: onsflow
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_preload_libraries=timescaledb,vector
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onsflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: onsflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
